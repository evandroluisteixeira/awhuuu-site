# Publica o site no GitHub Pages.
# Roda a cada mudança no main e de hora em hora (no minuto 5), para liberar
# as matérias agendadas. O agendamento do GitHub às vezes atrasa horas
# (em 25/11 a rodada das 20h05 só saiu à 1h57): rodando toda hora, a matéria
# das 20h entra no ar logo depois do post.
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx @11ty/eleventy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
