# Painel de edição do Awhuuu! (Pages CMS: https://app.pagescms.org)
media:
  input: src/img/materias
  output: /img/materias

content:
  - name: materias
    label: Matérias
    type: collection
    path: src/materias
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, editoria, date]
      sort: date
      order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: editoria
        label: Editoria
        type: select
        required: true
        options:
          values:
            - { value: pedrada-do-dia, label: "Pedrada do Dia" }
            - { value: rota-666, label: "Rota 666" }
            - { value: hora-do-lobo, label: "Hora do Lobo" }
            - { value: mondo-bizarro, label: "Mondo Bizarro" }
            - { value: fita-gasta, label: "Fita Gasta" }
            - { value: ultimo-bonde, label: "Último Bonde" }
            - { value: madrugada-eletrica, label: "Madrugada Elétrica" }
            - { value: sexta-de-lua-cheia, label: "Sexta de Lua Cheia" }
            - { value: garagem, label: "Garagem" }
            - { value: trapos-e-bugigangas, label: "Trapos e Bugigangas" }
      - name: numero
        label: Número na série
        type: number
      - name: date
        label: Data e hora de publicação
        description: A matéria só aparece no site a partir desta data.
        type: date
        options:
          time: true
      - name: rascunho
        label: Rascunho (não publicar)
        type: boolean
      - name: resumo
        label: Linha fina (resumo)
        type: text
      - name: capa
        label: Imagem de capa
        description: Se ficar vazio, usa a capa da editoria.
        type: image
      - name: capa_alt
        label: Descrição da capa (para leitores de tela)
        type: string
      - name: capa_credito
        label: Crédito da capa
        type: string
      - name: ficha
        label: Ficha técnica
        type: object
        list: true
        fields:
          - { name: campo, label: Campo, type: string }
          - { name: valor, label: Valor, type: string }
      - name: acervo
        label: Foto do acervo
        type: object
        fields:
          - { name: imagem, label: Foto, type: image }
          - { name: alt, label: Descrição da foto, type: string }
          - { name: legenda, label: Legenda, type: string }
      - name: body
        label: Texto
        type: rich-text
      - name: faixas
        label: Faixas (playlists)
        type: object
        list: true
        fields:
          - { name: musica, label: Música, type: string }
          - { name: artista, label: Artista, type: string }
          - { name: ano, label: Ano, type: number }
      - name: nota
        label: Nota (1 = lua nova, 5 = lua cheia)
        type: number
      - name: nota_frase
        label: Frase da nota
        type: string
      - name: spotify_playlist
        label: ID da playlist do Spotify
        description: O código depois de /playlist/ no link do Spotify (a playlist precisa estar pública).
        type: string
      - name: youtube_playlist
        label: ID da playlist do YouTube
        description: O código depois de list= no endereço da playlist.
        type: string
      - name: links_ouvir
        label: Links para ouvir
        type: object
        list: true
        fields:
          - { name: nome, label: Texto do botão, type: string }
          - { name: url, label: Endereço, type: string }
      - name: achados
        label: Achados (links de afiliado)
        description: Só aparecem quando os afiliados estiverem ativos nas configurações do site.
        type: object
        list: true
        fields:
          - { name: nome, label: Produto, type: string }
          - { name: url, label: Link de afiliado, type: string }
          - { name: imagem, label: Foto do produto (link da imagem na loja), type: string, description: "Na página do produto, clique com o botão direito na foto e copie o endereço da imagem. Opcional." }
      - name: lugares
        label: Lugares no mapa
        description: "Cada lugar vira um pino em /mapa/. Para pegar a latitude e a longitude, clique com o botão direito no lugar no Google Maps: o primeiro número é a latitude, o segundo a longitude."
        type: object
        list: true
        fields:
          - { name: nome, label: Nome do lugar, type: string }
          - { name: endereco, label: Endereço ou região, type: string }
          - { name: nota, label: O que aconteceu ali, type: string }
          - { name: lat, label: Latitude, type: number }
          - { name: lng, label: Longitude, type: number }
          - { name: aproximado, label: Local aproximado, type: boolean }
      - name: pergunta
        label: Pergunta final para o público
        type: string
      - name: fontes
        label: Fontes
        type: object
        list: true
        fields:
          - { name: nome, label: Fonte, type: string }
          - { name: url, label: Endereço, type: string }

  - name: editorias
    label: Editorias
    type: file
    path: src/_data/editorias.json
    list: true
    fields:
      - { name: slug, label: "Identificador (não mude depois de publicar)", type: string }
      - { name: nome, label: Nome, type: string }
      - { name: descricao, label: Descrição, type: text }
      - { name: capa, label: Capa, type: image }
      - { name: ativa, label: Editoria ativa, type: boolean }

  - name: agenda
    label: Agenda de shows
    type: file
    path: src/_data/agenda.json
    fields:
      - { name: aviso_vazio, label: Texto quando a agenda está vazia, type: text }
      - { name: chamada, label: Texto de abertura, type: text }
      - name: shows
        label: Shows
        description: Shows que já passaram somem sozinhos do site no dia seguinte.
        type: object
        list: true
        fields:
          - { name: banda, label: Banda ou evento, type: string }
          - { name: data, label: Data, type: date }
          - { name: hora, label: Horário, type: string }
          - { name: local, label: Local, type: string }
          - { name: cidade, label: Cidade, type: string }
          - { name: estado, label: Estado ou região, type: string, description: "Ex.: SC, PR, São Paulo, Califórnia, Buenos Aires" }
          - { name: pais, label: País, type: string, description: "Ex.: Brasil, Argentina, Estados Unidos" }
          - { name: preco, label: Preço, type: string }
          - { name: link_evento, label: Página do evento (de onde vem a foto automática), type: string, description: "Se o link do ingresso já é a página do evento (Sympla etc.), pode deixar vazio." }
          - { name: link_ingresso, label: Link do ingresso, type: string }
          - { name: cartaz, label: Foto de divulgação (enviar arquivo), type: image, options: { path: src/img/agenda } }
          - { name: cartaz_url, label: Foto de divulgação (ou cole o link da imagem), type: string }
          - { name: credito, label: Crédito da foto, type: string, description: "Ex.: Divulgação, Foto: Fulano" }
          - { name: texto, label: Texto curto, type: text }
          - { name: destaque, label: Em destaque (pacote pago), type: boolean }
          - { name: publicidade, label: Marcar como publicidade, type: boolean }

  - name: clube
    label: Clube (assinaturas e caixas)
    type: file
    path: src/_data/clube.json
    fields:
      - { name: titulo, label: Nome do clube, type: string }
      - { name: chamada, label: Texto de abertura, type: text }
      - { name: passos, label: Como funciona (passos), type: string, list: true }
      - name: versoes
        label: Versões (digital, disco em casa...)
        type: object
        list: true
        fields:
          - { name: nome, label: Nome, type: string }
          - { name: preco, label: Preço (vazio = "em breve"), type: string }
          - { name: texto, label: O que inclui, type: text }
      - name: assinaturas
        label: Assinaturas
        type: object
        list: true
        fields:
          - { name: nome, label: Nome, type: string }
          - { name: resumo, label: Resumo, type: text }
          - { name: sugestoes_titulo, label: Título das sugestões, type: string }
          - { name: sugestoes, label: Sugestões (bandas, discos, estilos), type: string, list: true }
          - { name: link_pagamento, label: Link de pagamento (vazio = lista de espera), type: string }
          - { name: ativo, label: Mostrar no site, type: boolean }
      - name: caixas
        label: Caixas para presente
        type: object
        list: true
        fields:
          - { name: nome, label: Nome, type: string }
          - { name: preco, label: Preço (vazio = "em breve"), type: string }
          - { name: resumo, label: Resumo, type: text }
          - { name: inclui, label: Vem na caixa, type: string, list: true }
          - { name: link_pagamento, label: Link de pagamento (vazio = lista de espera), type: string }
          - { name: ativo, label: Mostrar no site, type: boolean }
      - name: espera
        label: Lista de espera
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
          - { name: botao, label: Texto do botão, type: string }
          - { name: link, label: Link (newsletter ou formulário), type: string }
      - name: formulario
        label: Formulário da lista (Supabase)
        type: object
        fields:
          - { name: ativo, label: Mostrar formulário, type: boolean }
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
          - { name: privacidade, label: Texto de consentimento, type: text }
          - { name: sucesso, label: Mensagem depois de enviar, type: string }
          - { name: supabase_url, label: Supabase Project URL, type: string, description: "Supabase > Project Settings > API > Project URL" }
          - { name: chave_publica, label: Chave pública (anon/publishable), type: string, description: "Só a chave pública. Nunca a service_role/secret." }
      - { name: rodape, label: Nota no fim da página, type: text }

  - name: trilhas
    label: Trilhas do clube (ordem dos discos)
    type: file
    path: src/_data/trilhas.json
    fields:
      - { name: aviso, label: Nota interna, type: text }
      - name: trilhas
        label: Trilhas
        type: object
        list: true
        fields:
          - { name: nome, label: Nome (banda, estilo ou trilha), type: string }
          - { name: tipo, label: Caminho, type: string, description: "Ex.: História do Rock, Complete a coleção, Assine um estilo" }
          - { name: descricao, label: Descrição, type: text }
          - name: discos
            label: Discos, na ordem de envio
            type: object
            list: true
            fields:
              - { name: artista, label: Artista, type: string }
              - { name: album, label: Álbum, type: string }
              - { name: ano, label: Ano, type: string }

  - name: vitrine
    label: Anuncie e apoie
    type: file
    path: src/_data/vitrine.json
    fields:
      - { name: titulo, label: Título da página, type: string }
      - { name: chamada, label: Texto de abertura, type: text }
      - name: pacotes
        label: Pacotes
        type: object
        list: true
        fields:
          - { name: nome, label: Nome do pacote, type: string }
          - { name: preco, label: Preço, type: string }
          - { name: resumo, label: Resumo, type: text }
          - { name: inclui, label: O que inclui, type: string, list: true }
          - { name: especificacoes, label: Especificações do material, type: string, list: true }
          - { name: link_pagamento, label: "Link de pagamento (Mercado Pago). Vazio = botão 'Em breve'", type: string }
          - { name: ativo, label: Mostrar no site, type: boolean }
      - name: envio
        label: Envio do material
        type: object
        fields:
          - { name: texto, label: Texto, type: text }
          - { name: link_formulario, label: Link do formulário, type: string }
          - { name: email, label: E-mail, type: string }
      - name: apoio
        label: Apoio
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
          - { name: link, label: Link de pagamento (valor livre), type: string }
          - { name: pix, label: Chave Pix, type: string }
      - { name: regras, label: Regras de publicidade, type: text }

  - name: site
    label: Configurações do site
    type: file
    path: src/_data/site.json
    fields:
      - { name: nome, label: Nome, type: string }
      - { name: lema, label: Lema, type: string }
      - { name: url, label: Endereço, type: string }
      - { name: descricao, label: Descrição para o Google, type: text }
      - name: redes
        label: Redes
        type: object
        list: true
        fields:
          - { name: nome, label: Rede, type: string }
          - { name: rotulo, label: Perfil, type: string }
          - { name: url, label: Endereço, type: string }
      - name: newsletter
        label: Newsletter
        type: object
        fields:
          - { name: url, label: Endereço do Substack, type: string }
          - { name: nome, label: Nome da newsletter, type: string }
          - { name: chamada, label: Texto do convite, type: text }
      - { name: afiliados_ativos, label: Mostrar os Achados (afiliados), type: boolean }
      - { name: aviso_afiliados, label: Aviso de afiliados, type: text }
      - name: analytics
        label: Contador de visitas
        type: object
        fields:
          - { name: umami_id, label: ID do site no Umami (vazio = desligado), type: string }
