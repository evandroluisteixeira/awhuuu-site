# Painel de edição do Awhuuu! (Pages CMS: https://app.pagescms.org)
media:
  input: src/img/materias
  output: /img/materias

content:
  - name: materias
    label: Matérias
    type: collection
    path: src/materias
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, editoria, date]
      sort: date
      order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: assina
        label: Quem assina
        type: string
        description: "Código de quem assina, como está em Quem escreve: evandro, lobo, vampira, criatura ou um pseudônimo que você criar lá. Vazio: sai sem assinatura."
      - name: editoria
        label: Editoria
        type: select
        required: true
        options:
          values:
            - { value: pedrada-do-dia, label: "Pedrada do Dia" }
            - { value: rota-666, label: "Rota 666" }
            - { value: hora-do-lobo, label: "Hora do Lobo" }
            - { value: mondo-bizarro, label: "Mondo Bizarro" }
            - { value: fita-gasta, label: "Fita Gasta" }
            - { value: ultimo-bonde, label: "Último Bonde" }
            - { value: madrugada-eletrica, label: "Madrugada Elétrica" }
            - { value: sexta-de-lua-cheia, label: "Sexta de Lua Cheia" }
            - { value: garagem, label: "Garagem" }
            - { value: trapos-e-bugigangas, label: "Trapos e Bugigangas" }
            - { value: as-imortais, label: "As Imortais" }
            - { value: remendo, label: "Remendo" }
      - name: numero
        label: Número na série
        type: number
      - name: date
        label: Data e hora de publicação
        description: A matéria só aparece no site a partir desta data.
        type: date
        options:
          time: true
      - name: rascunho
        label: Rascunho (não publicar)
        type: boolean
      - name: resumo
        label: Linha fina (resumo)
        type: text
      - name: capa
        label: Imagem de capa
        description: Se ficar vazio, usa a capa da editoria.
        type: image
      - name: capa_alt
        label: Descrição da capa (para leitores de tela)
        type: string
      - name: capa_credito
        label: Crédito da capa
        type: string
      - name: ficha
        label: Ficha técnica
        type: object
        list: true
        fields:
          - { name: campo, label: Campo, type: string }
          - { name: valor, label: Valor, type: string }
      - name: acervo
        label: Foto do acervo
        type: object
        fields:
          - { name: imagem, label: Foto, type: image }
          - { name: alt, label: Descrição da foto, type: string }
          - { name: legenda, label: Legenda, type: string }
      - name: body
        label: Texto
        type: rich-text
      - name: faixas
        label: Faixas (playlists)
        type: object
        list: true
        fields:
          - { name: musica, label: Música, type: string }
          - { name: artista, label: Artista, type: string }
          - { name: ano, label: Ano, type: number }
      - name: nota
        label: Nota (1 = lua nova, 5 = lua cheia)
        type: number
      - name: nota_frase
        label: Frase da nota
        type: string
      - name: spotify_playlist
        label: ID da playlist do Spotify
        description: O código depois de /playlist/ no link do Spotify (a playlist precisa estar pública).
        type: string
      - name: videos
        label: Vídeos
        description: "Cole o link de um vídeo do YouTube (inclusive Shorts), do TikTok ou um Reel do Instagram. Pode pôr vários."
        type: string
        list: true
      - name: youtube_playlist
        label: ID da playlist do YouTube
        description: O código depois de list= no endereço da playlist.
        type: string
      - name: links_ouvir
        label: Links para ouvir
        type: object
        list: true
        fields:
          - { name: nome, label: Texto do botão, type: string }
          - { name: url, label: Endereço, type: string }
      - name: achados
        label: Achados (links de afiliado)
        description: Só aparecem quando os afiliados estiverem ativos nas configurações do site.
        type: object
        list: true
        fields:
          - { name: nome, label: Produto, type: string }
          - { name: url, label: Link de afiliado, type: string }
          - { name: imagem, label: Foto do produto (link da imagem na loja), type: string, description: "Na página do produto, clique com o botão direito na foto e copie o endereço da imagem. Opcional." }
      - name: lugares
        label: Lugares no mapa
        description: "Cada lugar vira um pino em /mapa/. Para pegar a latitude e a longitude, clique com o botão direito no lugar no Google Maps: o primeiro número é a latitude, o segundo a longitude."
        type: object
        list: true
        fields:
          - { name: nome, label: Nome do lugar, type: string }
          - { name: endereco, label: Endereço ou região, type: string }
          - { name: nota, label: O que aconteceu ali, type: string }
          - { name: lat, label: Latitude, type: number }
          - { name: lng, label: Longitude, type: number }
          - { name: aproximado, label: Local aproximado, type: boolean }
      - name: pergunta
        label: Pergunta final para o público
        type: string
      - name: fontes
        label: Fontes
        type: object
        list: true
        fields:
          - { name: nome, label: Fonte, type: string }
          - { name: url, label: Endereço, type: string }

  - name: editorias
    label: Editorias
    type: file
    path: src/_data/editorias.json
    list: true
    fields:
      - { name: slug, label: "Identificador (não mude depois de publicar)", type: string }
      - { name: nome, label: Nome, type: string }
      - { name: descricao, label: Descrição, type: text }
      - { name: capa, label: Capa, type: image }
      - { name: ativa, label: Editoria ativa, type: boolean }
      - { name: link, label: Link no cartão da home (opcional), type: string, description: "Ex.: /agenda/. Vazio = página da editoria." }

  - name: agenda
    label: Agenda de shows
    type: file
    path: src/_data/agenda.json
    fields:
      - { name: aviso_vazio, label: Texto quando a agenda está vazia, type: text }
      - { name: chamada, label: Texto de abertura, type: text }
      - name: shows
        label: Shows
        description: Shows que já passaram somem sozinhos do site no dia seguinte.
        type: object
        list: true
        fields:
          - { name: banda, label: Banda ou evento, type: string }
          - { name: data, label: Data, type: date }
          - { name: hora, label: Horário, type: string }
          - { name: local, label: Local, type: string }
          - { name: cidade, label: Cidade, type: string }
          - { name: estado, label: Estado ou região, type: string, description: "Ex.: SC, PR, São Paulo, Califórnia, Buenos Aires" }
          - { name: pais, label: País, type: string, description: "Ex.: Brasil, Argentina, Estados Unidos" }
          - { name: preco, label: Preço, type: string }
          - { name: link_evento, label: Página do evento (de onde vem a foto automática), type: string, description: "Se o link do ingresso já é a página do evento (Sympla etc.), pode deixar vazio." }
          - { name: link_ingresso, label: Link do ingresso, type: string }
          - { name: cartaz, label: Foto de divulgação (enviar arquivo), type: image, options: { path: src/img/agenda } }
          - { name: cartaz_url, label: Foto de divulgação (ou cole o link da imagem), type: string }
          - { name: credito, label: Crédito da foto, type: string, description: "Ex.: Divulgação, Foto: Fulano" }
          - { name: texto, label: Texto curto, type: text }
          - { name: destaque, label: Em destaque (pacote pago), type: boolean }
          - { name: publicidade, label: Marcar como publicidade, type: boolean }

  - name: casas
    label: Casas de rock
    type: file
    path: src/_data/casas.json
    fields:
      - { name: chamada, label: Texto de abertura, type: text }
      - { name: aviso_vazio, label: Texto quando o filtro não acha nada, type: text }
      - name: casas
        label: Casas
        description: "Arraste para mudar a ordem. Para tirar uma casa do site sem apagar, desmarque Ativa."
        type: object
        list: true
        fields:
          - { name: nome, label: Nome, type: string }
          - { name: slug, label: Endereço da página (sem acento nem espaço), type: string, description: "Ex.: celula-showcase. A página fica em /casas/celula-showcase/" }
          - { name: tipo, label: Tipo, type: string, description: "Escreva livre. Ex.: Casa de shows, Bar com palco, Pub, Porão" }
          - { name: cidade, label: Cidade, type: string }
          - { name: estado, label: Estado ou região, type: string }
          - { name: pais, label: País, type: string }
          - { name: endereco, label: Endereço, type: string, description: "É ele que o botão do Google Maps usa para a rota." }
          - { name: lat, label: Latitude (pino no mapa), type: number, description: "No Google Maps, clique com o botão direito no lugar: o primeiro número é a latitude." }
          - { name: lng, label: Longitude (pino no mapa), type: number, description: "O segundo número." }
          - { name: aproximado, label: Pino aproximado, type: boolean }
          - { name: estilos, label: Estilos, type: string, description: "Escreva livre. Ex.: metal, punk, tributos" }
          - { name: texto, label: Texto curto, type: text }
          - { name: instagram, label: Instagram (link), type: string }
          - { name: site, label: Site ou página de ingressos, type: string }
          - { name: foto, label: Foto, type: image, options: { path: src/img/casas } }
          - { name: foto_url, label: Foto (ou cole o link da imagem), type: string }
          - { name: pagina_foto, label: Página oficial de onde vem a foto automática, type: string, description: "Sem foto acima, o site usa a imagem de divulgação que esta página publica (a mesma que aparece ao colar o link no WhatsApp). Instagram não funciona: use o site da casa." }
          - { name: foto_inteira, label: Mostrar a imagem inteira (bom para logotipos), type: boolean }
          - { name: foto_alt, label: Descrição da foto (para leitores de tela), type: string }
          - { name: credito, label: Crédito da foto, type: string }
          - { name: videos, label: "Vídeos (YouTube, TikTok ou Instagram)", type: string, list: true }
          - { name: nomes_na_agenda, label: Como o nome aparece na agenda, type: string, list: true, description: "Os shows da agenda cujo local contém um destes nomes aparecem na página da casa." }
          - { name: ativa, label: Ativa (aparece no site), type: boolean }

  - name: bandas
    label: Bandas e artistas
    type: file
    path: src/_data/bandas.json
    fields:
      - { name: chamada, label: Texto de abertura, type: text }
      - { name: convite, label: Convite para cadastrar banda, type: text }
      - name: bandas
        label: Bandas e artistas
        description: "Para tirar do site sem apagar, desmarque Ativa. Bandas que chegam pelo formulário ficam na tabela bandas_enviadas do Supabase: copie para cá as que forem aprovadas."
        type: object
        list: true
        fields:
          - { name: nome, label: Nome, type: string }
          - { name: slug, label: Endereço da página (sem acento nem espaço), type: string, description: "Ex.: parafuso-silvestre. A página fica em /bandas/parafuso-silvestre/" }
          - { name: tipo, label: "Banda ou artista", type: string, description: "Escreva banda ou artista (artista muda os rótulos para Nascimento e Morte)." }
          - { name: cena, label: Cena, type: string, description: "Escreva livre. O filtro do site usa: cena local, clássica." }
          - { name: cidade, label: Cidade, type: string }
          - { name: pais, label: País, type: string }
          - { name: inicio, label: "Formação ou nascimento", type: string, description: "Ano (1984), ano e mês (1984-03) ou data completa (1984-03-20)." }
          - { name: fim, label: "Fim ou morte", type: string }
          - { name: estilos, label: Estilos, type: string, list: true }
          - { name: texto, label: Texto curto, type: text }
          - { name: site, label: Site oficial, type: string }
          - { name: instagram, label: Instagram (link), type: string }
          - { name: youtube, label: YouTube (link), type: string }
          - { name: youtube_canal, label: Código do canal do YouTube, type: string, description: "O código que começa com UC (fica no link youtube.com/channel/UC...). Com ele, os vídeos novos aparecem sozinhos na página." }
          - { name: spotify, label: Spotify (link), type: string }
          - { name: bandcamp, label: Bandcamp (link), type: string }
          - { name: foto, label: Imagem de perfil (envie a imagem oficial), type: image, options: { path: src/img/bandas }, description: "Foto ou logotipo oficial, de divulgação da própria banda. Sem imagem, o site mostra um patch com o nome." }
          - { name: foto_url, label: Ou cole o link da imagem oficial, type: string, description: "Ex.: a foto de divulgação do site oficial. Use o link direto da imagem (termina em .jpg, .png ou .webp)." }
          - { name: foto_credito, label: Crédito da foto, type: string }
          - { name: logo, label: Logotipo, type: image, options: { path: src/img/bandas/logos }, description: "Aparece no patch quando não há foto. Use o logo oficial ou um de licença livre." }
          - { name: logo_fundo, label: Fundo do logotipo, type: string, description: "claro (para logo escuro) ou escuro (para logo claro ou colorido)." }
          - { name: logo_fonte, label: Fonte do logotipo (link), type: string }
          - { name: logo_licenca, label: Licença do logotipo, type: string }
          - name: integrantes
            label: Integrantes
            description: "Viram barras na linha do tempo. Deixe Até vazio para quem ainda está na banda."
            type: object
            list: true
            fields:
              - { name: nome, label: Nome, type: string }
              - { name: funcao, label: Função, type: string, description: "Ex.: voz, guitarra" }
              - { name: desde, label: Desde (ano), type: string }
              - { name: ate, label: Até (ano), type: string }
          - name: discografia
            label: Discos de estúdio
            type: object
            list: true
            fields:
              - { name: titulo, label: Título, type: string }
              - { name: ano, label: Ano, type: string }
          - { name: nomes_na_agenda, label: Como o nome aparece na agenda, type: string, list: true, description: "Os shows da agenda com um destes nomes aparecem na página da banda." }
          - { name: musicbrainz, label: Código no MusicBrainz, type: string, description: "Com ele, os lançamentos aparecem sozinhos." }
          - { name: wikidata, label: Código no Wikidata, type: string }
          - { name: ativa, label: Ativa (aparece no site), type: boolean }

  - name: neste-dia
    label: Neste dia no rock (datas do Awhuuu!)
    type: file
    path: src/_data/nestedia_extra.json
    fields:
      - name: itens
        label: Datas
        description: "Datas que aparecem no topo do dia, com link para a matéria. As outras datas vêm sozinhas do Wikidata e do MusicBrainz."
        type: object
        list: true
        fields:
          - { name: data, label: "Dia (mês-dia)", type: string, description: "Ex.: 03-20 para 20 de março." }
          - { name: ano, label: Ano, type: number }
          - { name: texto, label: Texto, type: text }
          - { name: materia, label: Matéria (endereço curto), type: string, description: "O nome do arquivo da matéria, sem .md. Ex.: cbgb" }
          - { name: link, label: Ou um link de fora, type: string }

  - name: jogos
    label: Jogos
    type: file
    path: src/_data/jogos.json
    fields:
      - { name: titulo, label: Título da página de jogos, type: string }
      - name: imagens
        label: Imagens dos jogos (capa no menu de jogos e no topo de cada jogo)
        type: object
        fields:
          - { name: banda_do_dia, label: Banda do Dia, type: image, options: { path: src/img/jogos } }
          - { name: monstro, label: "Qual monstro é você?", type: image, options: { path: src/img/jogos } }
          - { name: prova, label: Prova do Lobo, type: image, options: { path: src/img/jogos } }
          - { name: copa, label: Copa do Rock, type: image, options: { path: src/img/jogos } }
          - { name: estrada, label: Estrada 666, type: image, options: { path: src/img/jogos } }
      - { name: chamada, label: Texto de abertura, type: text }
      - name: provas
        label: Prova do Lobo
        description: "O site mostra a prova mais recente cuja data já chegou. Crie a da semana com a data do domingo."
        type: object
        list: true
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: data, label: "Data de liberação (AAAA-MM-DD)", type: string }
          - name: perguntas
            label: Perguntas
            type: object
            list: true
            fields:
              - { name: pergunta, label: Pergunta, type: text }
              - { name: opcoes, label: Opções, type: string, list: true }
              - { name: certa, label: "Número da opção certa (a primeira é 0)", type: number }
              - { name: explicacao, label: Explicação depois da resposta, type: text }
              - { name: materia, label: Matéria (nome do arquivo sem .md), type: string }
      - name: monstro
        label: Qual monstro é você?
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
          - name: perguntas
            label: Perguntas
            type: object
            list: true
            fields:
              - { name: pergunta, label: Pergunta, type: text }
              - name: opcoes
                label: Opções
                type: object
                list: true
                fields:
                  - { name: texto, label: Texto, type: string }
                  - { name: monstro, label: "Monstro (a chave de um resultado)", type: string }
          - name: resultados
            label: Resultados (um por monstro)
            type: object
            list: true
            fields:
              - { name: chave, label: "Chave (ex.: lobo, vampira, frank)", type: string }
              - { name: nome, label: Nome, type: string }
              - { name: texto, label: Texto, type: text }
              - { name: imagem, label: Imagem, type: string, description: "Caminho de uma imagem do site, ex.: /img/capas/remendo.webp" }
              - { name: editoria, label: Editoria (endereço), type: string }
              - { name: link_texto, label: Texto do botão, type: string }
      - name: copas
        label: Copas do Rock (uma por tema)
        description: "Para criar um tema novo, duplique uma copa, troque o código, o tema, os 16 discos e as datas. A página principal mostra a copa que está valendo."
        type: object
        list: true
        fields:
          - { name: slug, label: "Código da copa (mude ao criar uma copa nova, ex.: copa-metal-90)", type: string }
          - { name: tema, label: Tema, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
          - name: discos
            label: "Discos, na ordem da chave (1º x 2º, 3º x 4º...)"
            type: object
            list: true
            fields:
              - { name: id, label: "Código curto (sem espaço)", type: string }
              - { name: disco, label: Disco, type: string }
              - { name: banda, label: Banda, type: string }
              - { name: ano, label: Ano, type: number }
              - { name: spotify, label: Código do disco no Spotify, type: string, description: "O código no fim do link open.spotify.com/album/CÓDIGO. Traz a capa e o player." }
              - { name: amazon, label: Código do produto na Amazon (ASIN), type: string, description: "Opcional. Sem ele, o botão Comprar abre a busca do disco na Amazon com a tag de afiliado." }
          - name: rodadas
            label: Rodadas
            type: object
            list: true
            fields:
              - { name: nome, label: Nome, type: string }
              - { name: inicio, label: "Início (AAAA-MM-DD)", type: string }
              - { name: fim, label: "Fim (AAAA-MM-DD)", type: string }
      - name: banda_do_dia
        label: Banda do Dia
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
          - { name: inicio, label: "Dia do nº 1 (AAAA-MM-DD)", type: string, description: "As bandas sorteadas vêm da lista de Bandas e artistas." }
      - name: estrada
        label: Estrada 666
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
          - { name: trilha, label: "Trilha (link de um arquivo .mp3 seu)", type: string, description: "Toca em loop durante a corrida. Deixe vazio para jogar só com os efeitos." }

  - name: links
    label: Página de links (bio do Instagram e TikTok)
    type: file
    path: src/_data/links.json
    fields:
      - { name: texto, label: Texto de abertura, type: text }
      - { name: mostrar_ultimas, label: Quantas matérias novas mostrar no topo, type: number }
      - name: links
        label: Links
        description: Arraste para mudar a ordem.
        type: object
        list: true
        fields:
          - { name: titulo, label: Texto do botão, type: string }
          - { name: url, label: Endereço, type: string, description: "Do site (ex.: /agenda/) ou de fora (https://...)" }
          - { name: destaque, label: Botão em destaque (vermelho), type: boolean }

  - name: pra-quem
    label: Página "Pra quem é o Awhuuu!"
    type: file
    path: src/pra-quem.md
    fields:
      - { name: title, label: Título, type: string }
      - { name: rotulo, label: Rótulo acima do título, type: string }
      - { name: descricao, label: Descrição para o Google, type: text }
      - { name: body, label: Texto, type: rich-text }

  - name: clube
    label: Clube (assinaturas e caixas)
    type: file
    path: src/_data/clube.json
    fields:
      - { name: titulo, label: Nome do clube, type: string }
      - { name: chamada, label: Texto de abertura, type: text }
      - { name: passos, label: Como funciona (passos), type: string, list: true }
      - name: versoes
        label: Versões (digital, disco em casa...)
        type: object
        list: true
        fields:
          - { name: nome, label: Nome, type: string }
          - { name: preco, label: Preço (vazio = "em breve"), type: string }
          - { name: texto, label: O que inclui, type: text }
      - name: assinaturas
        label: Assinaturas
        type: object
        list: true
        fields:
          - { name: nome, label: Nome, type: string }
          - { name: resumo, label: Resumo, type: text }
          - { name: sugestoes_titulo, label: Título das sugestões, type: string }
          - { name: sugestoes, label: Sugestões (bandas, discos, estilos), type: string, list: true }
          - { name: link_pagamento, label: Link de pagamento (vazio = lista de espera), type: string }
          - { name: ativo, label: Mostrar no site, type: boolean }
      - name: caixas
        label: Caixas para presente
        type: object
        list: true
        fields:
          - { name: nome, label: Nome, type: string }
          - { name: preco, label: Preço (vazio = "em breve"), type: string }
          - { name: resumo, label: Resumo, type: text }
